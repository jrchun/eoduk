<!doctype html>
<html lang="ko" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2420">
<title>어둑시니</title>
<meta name="description" content="해가 지면 어둠에 먹히는 도시, 구청에서 등불을 켜고 어둠을 밝혀 나가는 땅따먹기">
<!-- 링크 미리보기(카톡 등)와 앱 허브 카드. 제목·설명은 web/app.json의 name·summary와 맞춘다. -->
<meta property="og:title" content="어둑시니 — 해 지기 전에 등불을 지켜라">
<meta property="og:description" content="해가 지면 어둠에 먹히는 도시, 구청에서 등불을 켜고 어둠을 밝혀 나가는 땅따먹기">
<meta property="og:image" content="/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어둑시니">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <!-- 시간 흐름: 일출→일몰(해), 일몰→자정→일출(달). js/sunbar.js가 그린다 -->
    <div class="sunbar" id="sunbar" role="img" aria-label="오늘의 해와 달"></div>
    <div class="info">
      <span class="brand">어둑시니</span>
      <button class="who" id="emblem" type="button">
        <i class="dot" id="whoDot" aria-hidden="true"></i>
        <b id="guName">둘러보는 중</b>
        <small id="guSub"></small>
      </button>
      <div class="troops" id="troopBox" aria-label="병력">
        <span class="bar" aria-hidden="true"><i id="troopBar"></i></span>
        <span class="num troop-num" id="troops">-</span>
      </div>
      <button class="btn small primary" id="btnJoin" type="button">참여하기</button>
      <button class="sq pc-only" id="btnSound" type="button" aria-label="소리 켜기">소리</button>
      <button class="sq pc-only" id="btnMenuPc" type="button">메뉴</button>
    </div>
  </header>

  <div class="body" id="body">
    <main class="stage" id="stage">
      <canvas id="map" aria-label="시범 전선 등불 지도. 칸을 누르면 자세히 볼 수 있어요. 우리 칸을 끌어 적 칸에 놓으면 진군해요."></canvas>
      <div class="warn" id="warn" hidden>
        <div class="warn-text"><b id="warnTitle"></b><span id="warnSub"></span></div>
        <button type="button" class="warn-btn" id="warnBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.5-3 7.6-7 9.5-4-1.9-7-5-7-9.5V6z"/><path d="M12 8.5v7M8.5 12h7"/></svg><span>증원</span></button>
      </div>
      <p class="guide" id="guide"></p>
      <button type="button" class="front" id="btnFront"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg><span id="frontLbl">우리 전선으로</span></button>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </main>

    <aside class="panel" id="panel" aria-label="전황">
      <section class="card"><h3>다가오는 공격 <span class="num" id="pnIncN">0</span></h3><ul class="plist" id="pnInc"></ul></section>
      <section class="card"><h3>진행 중인 진군</h3><ul class="plist" id="pnMarch"></ul></section>
      <section class="card"><h3>깃발이 많이 꽂힌 칸</h3><ul class="plist" id="pnFlags"></ul></section>
      <section class="card"><h3>구 순위 · 살아남은 등불</h3><ul class="plist" id="pnRank"></ul></section>
      <a class="chatbtn" id="pnChat" target="_blank" rel="noopener">오픈채팅 열기</a>
    </aside>

    <aside class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button type="button" class="x" id="sheetClose" aria-label="닫기">✕</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </aside>
  </div>

  <nav class="bottom">
    <p class="flagline"><span class="tag"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4"/><path d="M6 4h10l-2 3.5L16 11H6"/></svg><span id="flagTag">깃발 최다</span></span><span id="flagText">아직 깃발이 없어요</span></p>
    <div class="acts">
      <button type="button" id="btnMarch" class="act primary"><svg class="ico ico-day" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V4"/><path d="M5 4h11l-2.5 3.5L16 11H5"/></svg><svg class="ico ico-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg><span id="marchLbl">진군</span></button>
      <button type="button" id="btnReinforce" class="act"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.5-3 7.6-7 9.5-4-1.9-7-5-7-9.5V6z"/><path d="M12 8.5v7M8.5 12h7"/></svg><span>증원</span></button>
      <button type="button" id="btnMenu" class="act menu" aria-label="메뉴"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><i class="badge" id="menuBadge" hidden></i></button>
    </div>
  </nav>
</div>

<!-- 온보딩: 세계관 3컷 → 구 고르기 → 등불지기 등록 → 홈 화면 추가 -->
<div class="overlay" id="onboard" hidden>
  <div class="ob-card" id="obCard"></div>
</div>

<!-- Supabase 공식 브라우저 라이브러리(@supabase/supabase-js, npm에서 받아 저장소에 넣은 파일). CDN을 쓰지 않는다. -->
<script src="vendor-supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
