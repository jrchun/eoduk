<!doctype html>
<html lang="ko" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2420">
<title>어둑시니</title>
<meta name="description" content="해가 지면 어둠에 먹히는 도시, 동네끼리 등불을 지키는 땅따먹기">
<!-- 링크 미리보기(카톡 등)와 앱 허브 카드. 제목·설명은 web/app.json의 name·summary와 맞춘다. -->
<meta property="og:title" content="어둑시니 — 해 지기 전에 등불을 지켜라">
<meta property="og:description" content="해가 지면 어둠에 먹히는 도시, 동네끼리 등불을 지키는 땅따먹기">
<meta property="og:image" content="/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어둑시니">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="emblem" id="emblem" type="button" aria-label="우리 구 정보">
      <span class="mark" id="emblemMark" aria-hidden="true">등</span>
      <span class="emblem-text"><b id="guName">어둑시니</b><small id="guSub">둘러보는 중</small></span>
    </button>
    <div class="gauge" aria-label="병력">
      <span class="lbl">병력</span>
      <span class="num" id="troops">-</span>
      <span class="bar" aria-hidden="true"><i id="troopBar"></i></span>
    </div>
    <div class="clock">
      <span class="lbl" id="clockLbl">일몰까지</span>
      <span class="num" id="clockVal">-</span>
    </div>
  </header>

  <button class="alert" id="alert" type="button" hidden></button>

  <main class="stage" id="stage">
    <canvas id="map" aria-label="시범 전선 등불 지도. 칸을 누르면 자세히 봅니다."></canvas>
    <div class="nightinfo" id="nightInfo" hidden>
      <p><b id="nightTitle">밤</b> <span class="num" id="nightNext"></span></p>
      <p class="hint" id="nightWatch"></p>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <nav class="bottom">
    <button type="button" id="btnMarch" class="act">진군</button>
    <button type="button" id="btnReinforce" class="act">증원</button>
    <button type="button" id="btnMenu" class="act">메뉴</button>
  </nav>

  <aside class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button type="button" class="x" id="sheetClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </aside>
</div>

<!-- 온보딩: 세계관 3컷 → 구 고르기 → 등불지기 등록 → 홈 화면 추가 -->
<div class="overlay" id="onboard" hidden>
  <div class="ob-card" id="obCard"></div>
</div>

<!-- Supabase 공식 브라우저 라이브러리(@supabase/supabase-js, npm에서 받아 저장소에 넣은 파일). CDN을 쓰지 않는다. -->
<script src="vendor-supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
